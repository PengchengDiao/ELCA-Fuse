[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-lcid"
version = "0.1.0"
description = "Source-aware luminance-chroma intervention diagnostic for IR-visible fusion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.23,<3",
  "Pillow>=9.1,<13",
  "scipy>=1.9,<2",
  "tqdm>=4.64,<5",
]

[project.scripts]
sa-lcid = "sa_lcid.cli:main"

[tool.setuptools.packages.find]
include = ["sa_lcid*"]

